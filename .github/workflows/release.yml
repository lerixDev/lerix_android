# Backup publisher for this package; normally ./release (atelerix/release.mjs) publishes from your Mac.
# Generated with the other Lerix SDK release workflows; keep them alike. See RELEASING.md.
# JitPack builds from the tag itself; this checks the tag, then asks JitPack to
# build it now (instead of on the first app that requests it) and waits for it.
name: Release

on:
  # Releases publish from your Mac (./release or Lerix Release Desk). This is the backup path: run it by hand
  # from the Actions tab with "Use workflow from" set to the release tag.
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write   # the GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Tag matches the SDK version
        run: |
          VERSION="$GITHUB_REF_NAME"
          FILE_VERSION=$(sed -n 's/.*const val SDK_VERSION = "\(.*\)".*/\1/p' core/src/main/kotlin/com/lerix/sdk/core/LerixRuntime.kt)
          test "$FILE_VERSION" = "$VERSION" || { echo "Tag $GITHUB_REF_NAME but SDK_VERSION is $FILE_VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - run: ./gradlew :lerix-core:testDebugUnitTest :lerix-messaging:testDebugUnitTest :lerix:assembleRelease

      - name: Build on JitPack
        run: |
          base="https://jitpack.io/com/github/lerixDev/lerix_android"
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$base/lerix/$VERSION/lerix-$VERSION.pom")
            if [ "$code" = "200" ]; then echo "JitPack built $VERSION"; exit 0; fi
            echo "JitPack: $code, waiting"; sleep 30
          done
          echo "JitPack did not finish; log: $base/$VERSION/build.log"; exit 1

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=""
          if [ -f "CHANGELOG.md" ]; then
            notes=$(awk -v v="$VERSION" '/^## /{ if (found) exit; h=$2; gsub(/[\[\]]/, "", h); if (h == v) { found=1; next } } found' "CHANGELOG.md")
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "lerix-android $VERSION" --notes "${notes:-See the changelog.}"
